name: Auto-update README

on:
  push:
    branches: [main]
    paths-ignore:
      - "README.md"
      - ".github/**"
      - "*.py"

jobs:
  update-readme:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: "3.x"

      - name: Check for new projects
        id: check_projects
        run: |
          # Count current projects in README
          current_count=$(grep -c "^- \*\*\[" README.md || echo "0")

          # Count actual project directories
          actual_count=$(find . -maxdepth 1 -type d -name "*App*" -o -name "*List*" -o -name "*Bot*" -o -name "*Basics*" | wc -l)

          echo "current_count=$current_count" >> $GITHUB_OUTPUT
          echo "actual_count=$actual_count" >> $GITHUB_OUTPUT

          if [ $actual_count -gt $current_count ]; then
            echo "needs_update=true" >> $GITHUB_OUTPUT
          else
            echo "needs_update=false" >> $GITHUB_OUTPUT
          fi

      - name: Update README
        if: steps.check_projects.outputs.needs_update == 'true'
        run: |
          python3 update_readme.py

      - name: Commit changes
        if: steps.check_projects.outputs.needs_update == 'true'
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action"

          if git diff --quiet README.md; then
            echo "No changes to commit"
          else
            git add README.md
            git commit -m "🤖 Auto-update README with new projects

            - Updated project count from ${{ steps.check_projects.outputs.current_count }} to ${{ steps.check_projects.outputs.actual_count }}
            - Auto-generated by GitHub Actions"
            git push
          fi
